<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Setup Tennis Draw</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
        color: #172114;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 700;
      }

      textarea {
        width: 100%;
        min-height: 260px;
        border: 1px solid #dbe4d6;
        border-radius: 8px;
        padding: 12px;
        font: inherit;
      }

      button {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 8px;
        padding: 13px 18px;
        background: #21764b;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
      }

      pre {
        overflow: auto;
        border-radius: 8px;
        padding: 12px;
        background: #f5f7f1;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Setup Tennis Draw</h1>
    <p>Paste one player per line. Format: <strong>Name, Group</strong></p>

    <label for="playersInput">Players</label>
    <textarea id="playersInput">Alex Chen, Group A</textarea>

    <button id="setupButton" type="button">Create / Reset Draw Data</button>
    <pre id="log"></pre>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
      const db = firebase.initializeApp(firebaseConfig).firestore();
      const log = document.querySelector("#log");

      function normalizeName(name) {
        return name.trim().toLowerCase().replace(/\s+/g, "-");
      }

      function parsePlayers(text) {
        return text
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            const parts = line.split(",").map((part) => part.trim());

            if (parts.length < 2 || !parts[0] || !parts[1]) {
              throw new Error(`Invalid line: ${line}`);
            }

            return {
              registeredName: parts[0],
              group: parts.slice(1).join(", ")
            };
          });
      }

      async function deleteCollection(collectionName) {
        const snapshot = await db.collection(collectionName).get();
        const batch = db.batch();

        snapshot.docs.forEach((document) => {
          batch.delete(document.ref);
        });

        await batch.commit();
      }

      document.querySelector("#setupButton").addEventListener("click", async () => {
        try {
          const players = parsePlayers(document.querySelector("#playersInput").value);
          const groups = [...new Set(players.map((player) => player.group))];
          const ids = players.map((player) => normalizeName(player.registeredName));

          if (ids.length !== new Set(ids).size) {
            throw new Error("Duplicate registered names found after normalization.");
          }

          log.textContent = "Creating draw data...";

          await deleteCollection("players");
          await deleteCollection("groups");
          await deleteCollection("drawnPlayers");

          const batch = db.batch();

          players.forEach((player) => {
            batch.set(db.collection("players").doc(normalizeName(player.registeredName)), {
              registeredName: player.registeredName,
              group: player.group,
              drawn: false,
              slot: null,
              drawnAt: null
            });
          });

          groups.forEach((group) => {
            batch.set(db.collection("groups").doc(group), {
              usedSlots: []
            });
          });

          await batch.commit();
          log.textContent = `Done. Created ${players.length} players and ${groups.length} groups.\n\nNow publish the final secure rules from firestore.rules before sharing the draw link.`;
        } catch (error) {
          log.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
