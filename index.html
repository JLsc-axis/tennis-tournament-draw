<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tennis Tournament Draw</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="draw-panel">
        <p class="eyebrow">Tournament Draw</p>
        <h1>Men's Singles Draw</h1>
        <p class="subtext">Enter your registered name to draw your group and position.</p>
        <form id="drawForm" class="draw-form">
          <label for="nameInput">Registered Name</label>
          <input id="nameInput" name="registeredName" type="text" autocomplete="name" placeholder="Enter your registered name" required>
          <button id="drawButton" type="submit">Draw</button>
        </form>
        <div id="status" class="status" aria-live="polite"></div>
      </section>

      <section id="myResult" class="my-result" aria-live="polite"></section>

      <section class="drawn-panel">
        <h2>Men's Singles · Already Drawn</h2>
        <div id="mensDrawnList" class="drawn-list"></div>
      </section>

      <section class="drawn-panel history-panel">
        <h2>Mixed Doubles · Results</h2>
        <div id="mixedDrawnList" class="drawn-list"></div>
      </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
